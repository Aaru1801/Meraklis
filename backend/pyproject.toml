[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhouse-edge"
version = "1.0.0"
description = "A local-first, NVIDIA-powered civic AI for Toronto renters and housing advocates."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openhouse*"]

[tool.ruff]
line-length = 100
target-version = "py311"
